name: Publish to npm

# Publishes sealed-token-auth to npm via Trusted Publishing (OIDC):
# no stored npm token — GitHub Actions proves this repo + workflow to
# npm, and npm issues a short-lived publish credential. Provenance is
# attached automatically. Requires the trusted-publisher connection on
# the package's npm settings to name this repo and this workflow file.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Latest npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
